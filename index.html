<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LearnLink.Ai</title>
<meta name="description" content="LearnLink.Ai is a student-friendly learning site for grades 7–12 with books, videos, quizzes and an offline AI study helper."><meta name="robots" content="index,follow"><meta property="og:title" content="LearnLink.Ai"><meta property="og:description" content="Grades 7–12 books, quizzes and an offline AI study helper."><meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#0b1020;--card:#151c36;--tx:#e8ecff;--mu:#9aa6d6;--ac:#7c5cff;--ac2:#22d3ee;--bd:#2a3563;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme=biology]{--bg:#0d1f14;--card:#14301f;--tx:#e6ffee;--mu:#9ad6ae;--ac:#2ecc71;--ac2:#a3e635;--bd:#265c3a}
[data-theme=math]{--bg:#1a1330;--card:#251b45;--tx:#f0eaff;--mu:#b8a6e6;--ac:#f59e0b;--ac2:#f472b6;--bd:#3f3270}
[data-theme=physics]{--bg:#06182b;--card:#0c2744;--tx:#e3f4ff;--mu:#8cc3e8;--ac:#06b6d4;--ac2:#3b82f6;--bd:#1b4a75}
[data-theme=literature]{--bg:#2b1d14;--card:#3a281c;--tx:#fff3e6;--mu:#d9b896;--ac:#e58e4a;--ac2:#f2c879;--bd:#5e4130}
[data-theme=history]{--bg:#2a2416;--card:#3a331f;--tx:#fbf5e0;--mu:#d6c690;--ac:#c9a227;--ac2:#b45309;--bd:#5c5130}
[data-theme=sports]{--bg:#0f1a12;--card:#17281b;--tx:#efffe9;--mu:#a6d6a0;--ac:#ef4444;--ac2:#facc15;--bd:#2f5a35}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;background:radial-gradient(1200px 600px at 80% -10%,color-mix(in srgb,var(--ac) 25%,transparent),transparent),var(--bg);color:var(--tx);min-height:100vh;line-height:1.5}
h1,h2,h3{margin:.3em 0}a{color:var(--ac2)}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);position:sticky;top:0;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);z-index:5}
.logo{font-weight:800;font-size:1.3rem;margin-right:auto}.logo span{color:var(--ac2)}
main{max-width:980px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:12px 0}
button,.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
button.ghost{background:transparent;border:1px solid var(--bd);color:var(--tx)}
button.on{background:var(--ac2);color:#06101f}
button.sm{padding:5px 9px;font-size:.85rem}button.red{background:#dc2626}
input,select,textarea{width:100%;background:var(--bg);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:9px;font:inherit;margin:4px 0 10px}
label{font-size:.85rem;color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.row>*{flex:0 0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.item{cursor:pointer;transition:transform .15s}.item:hover{transform:translateY(-3px);border-color:var(--ac)}
.tag{font-size:.75rem;padding:2px 8px;border-radius:99px;background:var(--bd);color:var(--tx)}
.auth{max-width:380px;margin:8vh auto}
img.bi{max-width:100%;border-radius:12px;margin:10px 0}
.muted{color:var(--mu)}.ok{color:#4ade80}.bad{color:#f87171}
.flash{perspective:600px;cursor:pointer;min-height:90px}.flash div{padding:16px;text-align:center;border:1px dashed var(--ac2);border-radius:12px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto}td,th{border:1px solid var(--bd);padding:7px;text-align:left}th{background:var(--bd)}
.opt{display:block;width:100%;text-align:left;margin:5px 0;background:var(--bg);border:1px solid var(--bd);color:var(--tx)}
.pill{display:inline-block;width:9px;height:9px;border-radius:50%;background:#4ade80;margin-right:4px}
.cov{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:10px;background:linear-gradient(160deg,var(--ac),var(--ac2));font-size:3rem;margin-bottom:8px;box-shadow:0 6px 16px #0006}.cov.empty{background:transparent;border:2px dashed var(--bd);color:var(--mu);box-shadow:none}
.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slots select{font-size:.72rem;padding:5px}.slot-t{font-size:.75rem;text-align:center;min-height:2.4em}
.tag{text-transform:capitalize}
[data-theme=chemistry]{--bg:#0f1d1a;--card:#162e29;--tx:#e8fff9;--mu:#8fd6c4;--ac:#14b8a6;--ac2:#84cc16;--bd:#25564d}
[data-theme=geography]{--bg:#0e1c24;--card:#15303d;--tx:#eaf8ff;--mu:#93c9dc;--ac:#0ea5e9;--ac2:#34d399;--bd:#235266}
[data-theme=art]{--bg:#220f22;--card:#341a36;--tx:#fff0fb;--mu:#e0a8d8;--ac:#ec4899;--ac2:#fbbf24;--bd:#5a2c5e}
[data-theme=music]{--bg:#14102b;--card:#201a45;--tx:#f0edff;--mu:#b3a8f0;--ac:#8b5cf6;--ac2:#f43f5e;--bd:#3b3278}
[data-theme=technology]{--bg:#0a0f14;--card:#111c26;--tx:#e6f1ff;--mu:#8aa7c4;--ac:#22c55e;--ac2:#38bdf8;--bd:#1e3548}
[data-theme=economics]{--bg:#161a0e;--card:#232b14;--tx:#f6ffe0;--mu:#bcd48a;--ac:#eab308;--ac2:#22c55e;--bd:#3d4a1f}
:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}.card{backdrop-filter:blur(6px)}.item:hover{box-shadow:0 8px 24px color-mix(in srgb,var(--ac) 40%,transparent)}
.hero{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:18px;border-radius:18px;background:linear-gradient(120deg,color-mix(in srgb,var(--ac) 55%,var(--card)),color-mix(in srgb,var(--ac2) 40%,var(--card)));background-size:200% 200%;animation:gs 10s ease infinite;border:1px solid var(--bd);margin:12px 0}@keyframes gs{50%{background-position:100% 50%}}
.av{width:64px;height:64px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2rem;object-fit:cover;border:3px solid var(--ac2);flex:none}
.xp{height:8px;background:#0005;border-radius:9px;overflow:hidden}.xp i{display:block;height:100%;background:var(--ac2)}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;background:#0004;font-size:.8rem;margin:2px}.badge{display:inline-block;padding:4px 10px;border-radius:10px;border:1px solid var(--bd);margin:3px;font-size:.85rem}.badge.off{opacity:.35;filter:grayscale(1)}
.emo{font-size:1.3rem;background:transparent;border:1px solid var(--bd);padding:4px 8px;margin:2px}
.cf{position:fixed;top:-30px;font-size:24px;z-index:99;pointer-events:none;animation:fall 2.2s ease-in forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
#bg{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}#bg span{position:absolute;opacity:.14;animation:fl 9s ease-in-out infinite alternate}
@keyframes fl{from{transform:translateY(0) rotate(-8deg)}to{transform:translateY(-26px) rotate(8deg)}}
#app{position:relative;z-index:1}
.caret{display:inline-block;width:7px;height:1em;background:var(--ac2);vertical-align:text-bottom;margin-left:2px;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}
.dots::after{content:'';animation:dt 1.2s steps(4) infinite}@keyframes dt{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
@media (prefers-reduced-motion:reduce){#bg span{animation:none}}
.fc{cursor:pointer;margin:10px 0}.fcin{min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;border-radius:16px;border:2px solid var(--ac);background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--ac) 18%,var(--card)));animation:fcf .3s}.fcin.back{border-color:var(--ac2);background:linear-gradient(145deg,var(--card),color-mix(in srgb,var(--ac2) 22%,var(--card)))}.fcin small{opacity:.7;letter-spacing:.15em;margin-bottom:8px}.fcin div{font-size:1.15rem;white-space:pre-line}@keyframes fcf{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
h4{margin:.8em 0 .2em}
</style></head>
<body data-theme="space"><div id="bg"></div><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ADMIN_PW='',THEMES=['space','biology','math','physics','literature','history','sports','chemistry','geography','art','music','technology','economics'];
const GR=[7,8,9,10,11,12],TM=[1,2,3];
function load(){try{return JSON.parse(localStorage.getItem('sl_db'))||{users:{},items:[]}}catch(e){return{users:{},items:[]}}}
let db=load(),me=null,S={g:11,t:2,ty:'all',view:'lib'},draft=null,ai={g:11,t:2,id:'',out:''};
function save(){try{localStorage.setItem('sl_db',JSON.stringify(db))}catch(e){alert('Storage is full. Remove some uploads or use smaller files.')}}
async function sha(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
const U=()=>db.users[me],isAdmin=()=>me==='admin';
const uid=()=>Math.random().toString(36).slice(2,10);

/* ---------- AUTH ---------- */
function authView(msg=''){setTheme('space');$('#app').innerHTML=`<div class="auth card"><h1>🚀 Learn<span style="color:var(--ac2)">Link.Ai</span></h1><p class="muted">Space science &amp; technology learning for grades 7–12.</p>
<label>Student name</label><input id="un" autocomplete="username"><label>Password</label><div style="position:relative"><input id="pw" type="password" autocomplete="current-password" style="padding-right:76px"><button type="button" class="ghost sm" style="position:absolute;right:6px;top:7px" onclick="togglePw(this)">👁 Show</button></div>
<div class="bad">${esc(msg)}</div><div class="row"><button onclick="login()">Log in</button><button class="ghost" onclick="signup()">Sign up</button></div></div>`}
async function login(){const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
 if(n==='admin'){const ok=await api({action:'check',pw:p});if(ok&&ok.ok){adminPw=p;try{sessionStorage.setItem('sl_ap',p)}catch(e){}db.users.admin=db.users.admin||{name:'admin',theme:'space',fav:[],off:[]};save();return enter('admin')}return authView(ok?'Wrong admin password.':'Admin login needs an internet connection.')}
 const u=db.users[n];if(u&&u.h===await sha(p))enter(n);else authView('Wrong name or password.')}
async function signup(){const n=$('#un').value.trim().toLowerCase(),p=$('#pw').value;
 if(n.length<2||p.length<4)return authView('Name 2+ chars and password 4+ chars.');
 if(n==='admin'||db.users[n])return authView('That name is taken.');
 db.users[n]={name:n,h:await sha(p),age:'',school:'',bio:'',theme:'space',fav:[],off:[]};save();enter(n)}
function enter(n){me=n;const u=db.users[n];u.fav=fav4(u.fav);u.sd=u.sd||[];['seed-piecewise','seed-acadcomm','seed-chemrxn'].forEach(id=>{if(!u.sd.includes(id)&&db.items.some(i=>i.id===id)){if(!u.off.includes(id))u.off.push(id);u.sd.push(id)}});const td=new Date().toDateString(),yd=new Date(Date.now()-864e5).toDateString();if(u.last!==td){u.streak=u.last===yd?(u.streak||0)+1:1;u.last=td}save();try{sessionStorage.setItem('sl_me',n)}catch(e){}S.view='lib';render()}
function logout(){me=null;adminPw='';try{sessionStorage.removeItem('sl_ap')}catch(e){}try{sessionStorage.removeItem('sl_me')}catch(e){}authView()}

function togglePw(b){const p=$('#pw'),s=p.type==='password';p.type=s?'text':'password';b.textContent=s?'🙈 Hide':'👁 Show'}
/* ---------- SHELL ---------- */
function render(){setTheme(U().theme);try{sessionStorage.setItem('sl_v',S.view==='item'?'lib':S.view)}catch(e){}
 const nav=[['lib','📚 Library'],['ai','🤖 AI Helper'],['prof','👤 Profile']];if(isAdmin())nav.push(['adm','🛠 Admin']);
 $('#app').innerHTML=`<header><div class="logo">🚀 Learn<span>Link.Ai</span></div>${nav.map(([k,l])=>`<button class="${S.view===k?'on':'ghost'}" onclick="S.view='${k}';render()">${l}</button>`).join('')}
 <span class="muted"><span class="pill" style="background:${navigator.onLine?'#4ade80':'#f59e0b'}"></span>${navigator.onLine?'Online':'Offline'}</span><button class="ghost sm" onclick="saveApp()">⬇ Get app</button><button class="ghost sm" onclick="logout()">Log out</button></header><main id="m"></main>`;
 ({lib:libView,ai:aiView,prof:profView,adm:admView,item:itemView})[S.view]()}
addEventListener('online',()=>me&&render());addEventListener('offline',()=>me&&render());

/* ---------- LIBRARY ---------- */
function filt(){return db.items.filter(i=>(S.dl?U().off.includes(i.id):(i.grade==S.g&&i.term==S.t))&&(S.ty==='all'||i.type===S.ty))}
function libView(){const L=filt(),ic={book:'📖',video:'🎬',quiz:'📝'};
 $('#m').innerHTML=`${hero()}<h2>Library</h2><div class="row">${GR.map(g=>`<button class="${S.g==g?'on':'ghost'}" onclick="S.g=${g};render()">Grade ${g}</button>`).join('')}</div>
 <div class="row" style="margin-top:8px">${TM.map(t=>`<button class="${S.t==t?'on':'ghost'}" onclick="S.t=${t};render()">Term ${t}</button>`).join('')}
 <button class="${S.dl?'on':'ghost'}" onclick="S.dl=!S.dl;render()">⬇ My downloads</button><label class="btn ghost" style="cursor:pointer;color:var(--tx)">Import file<input type="file" accept=".json" hidden onchange="importFile(this)"></label><select style="width:auto;margin:0" onchange="S.ty=this.value;render()">${['all','book','video','quiz'].map(x=>`<option value="${x}" ${S.ty==x?'selected':''}>${cap(x)}</option>`).join('')}</select></div>
 ${L.length?`<div class="grid" style="margin-top:12px">${L.map(i=>`<div class="card item" onclick="open_('${i.id}')">${cov(i)}<h3>${esc(i.title)}</h3><span class="tag">${i.type}</span> ${U().off.includes(i.id)?'<span class="tag">⬇ offline</span>':''}</div>`).join('')}</div>`:`<div class="card muted">Nothing here yet for Grade ${S.g}, Term ${S.t}. ${isAdmin()?'Add content in the Admin tab.':'Your teacher will add content soon.'}</div>`}`}
function open_(id){const u=U();u.read=u.read||[];if(!u.read.includes(id)){u.read.push(id);addXP(5)}S.cur=id;S.view='item';render()}
function dl(id,file){const u=U();if(!u.off.includes(id)){u.off.push(id);addXP(5)}save();
 if(file){const i=db.items.find(x=>x.id===id);saveFile(i.title.replace(/\W+/g,'_')+'.learnlink.json',JSON.stringify(i))}render()}
function itemView(){const i=db.items.find(x=>x.id===S.cur);if(!i){S.view='lib';return render()}
 const off=U().off.includes(i.id),fav=U().fav.includes(i.id);let body='';
 if(i.type==='book')body=i.blocks.map(b=>b.t==='img'?`<img class="bi" src="${b.v}">`:rtext(b.v)).join('');
 else if(i.type==='video')body=/^data:/.test(i.src)?`<video controls style="width:100%;border-radius:12px" src="${i.src}"></video>`:`<p><a href="${esc(i.src)}" target="_blank" rel="noopener">Open video link</a></p>`;
 else body=`<div id="qz"></div>`;
 $('#m').innerHTML=`<button class="ghost sm" onclick="S.view='lib';render()">← Back</button><div class="card"><div class="row" style="align-items:flex-start;flex-wrap:nowrap"><div style="width:110px;flex:none">${cov(i)}</div><div><h2>${esc(i.title)}</h2><span class="tag">Grade ${i.grade} · Term ${i.term} · ${i.type}</span></div></div>
 <div class="row" style="margin:10px 0"><button onclick="dl('${i.id}',false)">${off?'✔ Saved offline':'⬇ Save offline'}</button><button class="ghost" onclick="dl('${i.id}',true)">Download file</button><button class="ghost" onclick="favT('${i.id}')">${fav?'★ Favorite':'☆ Favorite'}</button><button class="ghost" onclick="ai={...ai,g:${i.grade},t:${i.term},id:'${i.id}'};S.view='ai';render()">🤖 Ask AI</button></div>${body}</div>`;
 if(i.type==='quiz')runQuiz(i.questions,$('#qz'))}
function favT(id){const u=U();u.fav=fav4(u.fav);const k=u.fav.indexOf(id);if(k>=0)u.fav[k]=null;else{const e=u.fav.indexOf(null);if(e<0)return alert('Your four favorite slots are full. Replace one in your Profile.');u.fav[e]=id}save();render()}
function lev(a,b){const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function chk(q,v){v=String(v).trim();if(!v)return false;
 if(q.num){const m=v.replace(/,/g,'').replace(/[−–]/g,'-').match(/-?\d+(\.\d+)?(\/\d+)?/);if(!m)return false;const x=m[0].includes('/')?m[0].split('/').reduce((a,b)=>a/b):parseFloat(m[0]);return Math.abs(x-q.ans[0])<=Math.max(.01,Math.abs(q.ans[0])*.005)}
 const N=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').replace(/ reactions?$/,'').trim(),n=N(v);
 return q.ans.some(a=>{const A=N(a);return n===A||(A.length>5&&lev(n,A)<=1)||(q.loose&&n.length>=4&&A.includes(n)&&n.length>=A.length*.6)})}
function runQuiz(qs,el){let n=0,sc=0;window._q=qs;
 const done=()=>{qDone(sc,qs.length);const r=sc/qs.length;el.innerHTML=`<h3>Score: ${sc}/${qs.length}</h3><p class="muted">${r>=.8?'Excellent work! 🎉':r>=.5?'Good effort. Review the ones you missed, then try again.':'Keep going! Re-read the lesson and try again.'}</p><button id="rt">Retry these</button>`;el.querySelector('#rt').onclick=()=>runQuiz(window._q,el)};
 const fin=(ok,q)=>{if(ok){sc++;addXP(10)}return `<p class="${ok?'ok':'bad'}">${ok?'Correct!':'Not quite.'}</p>`+(q.t==='type'&&!ok?`<p>Answer: <b>${esc(q.disp||q.ans[0])}</b></p>`:'')+(q.e?`<div class="muted" style="white-space:pre-line">${esc(q.e)}</div>`:'')+'<p><button id="nx">Next</button></p>'};
 const step=()=>{if(n>=qs.length)return done();const q=qs[n],kind=q.kind||(q.t==='type'?'Answer':'Multiple choice');
  el.innerHTML=`<p class="muted">Question ${n+1} of ${qs.length} · ${esc(kind)}</p><p style="white-space:pre-line"><b>${esc(q.q)}</b></p>`+(q.t==='type'?`<input id="ta" placeholder="Type your answer" autocomplete="off"><div class="row"><button id="ck">Check</button>${q.h?'<button class="ghost" id="hn">Hint</button>':''}<button class="ghost" id="sk">I do not know</button></div><div id="hb" class="muted"></div>`:q.o.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o)}</button>`).join(''))+'<div id="fb"></div>';
  const nx=()=>{el.querySelector('#nx').onclick=()=>{n++;step()}};
  if(q.t==='type'){const ta=el.querySelector('#ta');ta.focus();const go=ok=>{ta.disabled=true;el.querySelector('#ck').disabled=true;el.querySelector('#sk').disabled=true;el.querySelector('#fb').innerHTML=fin(ok,q);nx()};
   el.querySelector('#ck').onclick=()=>{if(!ta.value.trim()){ta.focus();return}go(chk(q,ta.value))};ta.onkeydown=e=>{if(e.key==='Enter')el.querySelector('#ck').click()};
   el.querySelector('#sk').onclick=()=>go(false);const hn=el.querySelector('#hn');if(hn)hn.onclick=()=>{el.querySelector('#hb').textContent='💡 Hint: '+q.h}}
  else el.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,ok=k===q.a;el.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(j===q.a)x.style.borderColor='#4ade80';else if(j===k)x.style.borderColor='#f87171'});el.querySelector('#fb').innerHTML=fin(ok,q);nx()})};
 step()}

/* ---------- PROFILE ---------- */
function profView(){const u=U();
 $('#m').innerHTML=`<h2>Profile</h2>${profHead(u)}<div class="card"><label>Name</label><input value="${esc(u.name)}" disabled><label>Age</label><input id="pa" type="number" oninput="saveProf()" value="${esc(u.age)}"><label>School</label><input id="ps" oninput="saveProf()" value="${esc(u.school)}"><label>Bio</label><textarea id="pb" rows="3" oninput="saveProf()">${esc(u.bio)}</textarea>
 <label>Theme</label><select id="pt" onchange="saveProf(true)">${THEMES.map(t=>`<option value="${t}" ${u.theme==t?'selected':''}>${cap(t)}</option>`).join('')}</select><p class="muted" style="margin:0">Changes save automatically.</p></div>
 <div class="card"><h3>★ Favorite books</h3><p class="muted">Show off your top four.</p>${favSlots(u)}</div>`}
function saveProf(th){const u=U();u.age=$('#pa').value;u.school=$('#ps').value;u.bio=$('#pb').value;if(th===true){u.theme=$('#pt').value;setTheme(u.theme)}save()}

/* ---------- ADMIN ---------- */
function newDraft(){draft={id:uid(),type:'book',grade:7,term:1,title:'',blocks:[{t:'text',v:''}],src:'',questions:[],qtext:''}}
function admView(){if(!draft)newDraft();const d=draft;
 $('#m').innerHTML=`<h2>Admin</h2><div class="card"><h3>${db.items.some(i=>i.id===d.id)?'Edit':'New'} upload</h3>
 <div class="row"><div><label>Type</label><select onchange="sync();draft.type=this.value;admView()">${['book','video','quiz'].map(x=>`<option value="${x}" ${d.type==x?'selected':''}>${cap(x)}</option>`).join('')}</select></div>

const STOP=new Set('the a an and or of to in on is are was were be been it its this that for with as by at from which their there these those can has have had not but if then than so such into also more most other some any each about over under between when what who how why does do'.split(' '));
const sents=t=>t.split('\n').flatMap(l=>l.replace(/\s+/g,' ').match(/[^.!?]+[.!?]*/g)||[]).map(s=>s.trim()).filter(s=>s.split(' ').length>=5);

function keys(t,n=10){const f={};words(t).forEach(w=>f[w]=(f[w]||0)+1);return Object.entries(f).sort((a,b)=>b[1]-a[1]).slice(0,n).map(x=>x[0])}

function runAI(k){const q=$('#aq').value.trim();let h='';
 if(k==='math')return setOut(mathSteps(q));
 const it=db.items.find(i=>i.id===ai.id);
 if(!it)return setOut('<p class="bad">Please choose a grade, term and book title first.</p>');
 if(!U().off.includes(it.id))return setOut('<p class="bad">Save this book offline first so the AI can read it.</p><button onclick="ai.out=\'\';dl(\''+it.id+'\',false)">⬇ Save it now</button>');
 const t=bookText(it),S_=sents(t);if(S_.length<2)return setOut('<p class="bad">This item has too little text for the AI to work with.</p>');
 const kw=keys(t,12),sc=s=>words(s).reduce((a,w)=>a+(kw.includes(w)?1:0),0);
 if(k==='quiz')return aiQuiz(it,t,S_);if(k==='life')return aiLife(it,t,S_);if(k==='solve')return aiSolve(it,t);if(k==='flash')return aiFlash(it,t,S_,kw);if(k==='rev')return aiReview(it,t,S_,kw);if(k==='ask')return aiAsk(it,t,S_,q);if(k==='rev'){h=`<h3>Reviewer: ${esc(it.title)}</h3><p><b>Key terms:</b> ${kw.slice(0,8).map(esc).join(', ')}</p><ol>${[...S_].sort((a,b)=>sc(b)-sc(a)).slice(0,6).map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`}
 if(k==='flash'){const defs=S_.filter(s=>/\b(is|are|refers to|means|called)\b/i.test(s)).slice(0,8);const cards=(defs.length?defs:S_.slice(0,6)).map(s=>{const m=s.match(/^(.{3,60}?)\s+(is|are|refers to|means)\s+(.+)$/i);return m?[`What ${m[2]==='are'?'are':'is'} ${m[1]}?`,m[3]]:[`Complete: ${s.split(' ').slice(0,4).join(' ')} …`,s]});h=`<h3>Flashcards (tap to flip)</h3>`+cards.map(c=>`<div class="flash" onclick="this.firstChild.textContent=this.dataset.f?this.dataset.q:this.dataset.a;this.dataset.f=this.dataset.f?'':1" data-q="${esc(c[0])}" data-a="${esc(c[1])}"><div>${esc(c[0])}</div></div>`).join('<br>')}
 if(k==='quiz'){const pool=kw,qs=[];[...S_].sort((a,b)=>sc(b)-sc(a)).forEach(s=>{if(qs.length>=5)return;const w=words(s).find(x=>kw.includes(x)&&x.length>4);if(!w)return;const o=[w,...pool.filter(x=>x!==w).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);qs.push({q:'Fill in the blank: '+s.replace(new RegExp(w,'i'),'_____'),o,a:o.indexOf(w)})});if(!qs.length)return setOut('<p>Not enough material for a quiz.</p>');setOut('<h3>Practice quiz</h3><div id="aiq"></div>');return runQuiz(qs,$('#aiq'))}
 if(k==='form'){const f=t.split('\n').flatMap(l=>l.split(/(?<=\.)\s/)).filter(l=>(/[A-Za-z)]\s*=\s*[-\w(]/.test(l)||/→/.test(l))&&l.length<140);h=f.length?`<h3>Formulas found</h3><ul>${f.map(x=>`<li><code>${esc(x.trim())}</code></li>`).join('')}</ul>`:'<p>No formulas needed here — this book has none written in it.</p>'}
 if(k==='cmp'){const tb=tables(it);if(tb)return setOut(tb);const top=kw.slice(0,5);h=`<h3>Comparison table</h3><table><tr><th>Term</th><th>What the book says</th><th>Mentions</th></tr>${top.map(w=>{const s=S_.find(x=>new RegExp('\\b'+w,'i').test(x))||'—';return`<tr><td><b>${esc(w)}</b></td><td>${esc(s)}</td><td>${t.toLowerCase().split(w).length-1}</td></tr>`}).join('')}</table>`}
 if(k==='life'){const w=kw[0],w2=kw[1],s=S_.find(x=>x.toLowerCase().includes(w))||S_[0];h=`<h3>Real-life problem</h3><p>Imagine you’re explaining <b>${esc(w)}</b> to a friend while working on a project about <b>${esc(w2)}</b>. The book says: “${esc(s)}”</p><ol><li>Name a place at home or in your community where you could see ${esc(w)}.</li><li>Describe how it connects to ${esc(w2)}.</li><li>Predict what would change if ${esc(w)} were missing, and explain using the book.</li></ol>`}
 if(k==='ask'){if(!q)return setOut('<p class="bad">Type a question first.</p>');const qw=words(q);const r=[...S_].map(s=>[s,words(s).filter(w=>qw.includes(w)).length]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);h=r.length?`<h3>From “${esc(it.title)}”</h3>${r.map(x=>`<p>${esc(x[0])}</p>`).join('')}`:'<p>I couldn’t find that in this book. Try other words, or choose another book.</p>'}
 setOut(h)}
let tk=0;
function setOut(h){ai.out=h;const o=$('#aout');if(!o)return;const id=++tk;
 if(h.indexOf('id="aiq"')>-1){o.innerHTML=h;return}
 o.innerHTML='<span class="muted">Thinking<span class="dots"></span></span>';
 setTimeout(()=>{if(id!==tk)return;o.innerHTML=h;const w=document.createTreeWalker(o,NodeFilter.SHOW_TEXT),ns=[];let n;while(n=w.nextNode())ns.push([n,n.data]);ns.forEach(x=>x[0].data='');
 const cur=document.createElement('span');cur.className='caret';let a=0,b=0;
 const tick=()=>{if(id!==tk||!document.body.contains(o)||a>=ns.length){cur.remove();return}const[nd,tx]=ns[a];b+=3;nd.data=tx.slice(0,b);nd.after(cur);if(b>=tx.length){a++;b=0}setTimeout(tick,18)};tick()},650)}
function mathSteps(q){if(!q)return'<p class="bad">Type a math problem first, e.g. 3x-4=11 or (12+8)/4.</p>';
 const c=s=>s.replace(/\^/g,'**').replace(/(\d)\s*x/g,'$1*x').replace(/\)\s*x/g,')*x').replace(/x\s*\(/g,'x*(').replace(/(\d)\s*\(/g,'$1*(');
 if(/[^0-9x+\-*/().^=\s]/.test(q))return'<p class="bad">I can handle numbers, x, + − × ÷ ^ and parentheses.</p>';
 try{if(q.includes('=')){const[l,r]=q.split('=').map(c),f=x=>Function('x','return ('+l+')-('+r+')')(x),b=f(0),a=f(1)-b;if(!a)return'<p>This isn’t a one-variable linear equation.</p>';const x=-b/a,R=n=>+n.toFixed(4);
 return`<h3>Solve ${esc(q)}</h3><ol><li>Move everything to one side: <code>${R(a)}x + ${R(b)} = 0</code></li><li>Subtract ${R(b)} from both sides: <code>${R(a)}x = ${R(-b)}</code></li><li>Divide both sides by ${R(a)}: <code>x = ${R(x)}</code></li><li>Check: substitute x = ${R(x)} back in and both sides match. ✔</li></ol>`}
 const v=Function('return ('+c(q)+')')();return`<h3>${esc(q)}</h3><ol><li>Work inside parentheses first, then powers, then × ÷, then + −.</li><li>Result: <b>${+(+v).toFixed(6)}</b></li></ol>`}catch(e){return'<p class="bad">I couldn’t read that problem. Check the brackets and signs.</p>'}}

function seedPW(){if(db.seeded)return;db.seeded=1;const U_='data:image/svg+xml;utf8,';db.items.push({id:'seed-piecewise',type:'book',grade:11,term:2,title:'Piecewise Functions',cover:U_+encodeURIComponent(COVER),blocks:[
{t:'text',v:"What is a piecewise function?\nA piecewise function is a function that is defined by different rules on different parts of its domain. Each rule is called a piece, and each piece applies only to a specific interval of x-values. Think of it as a function with a set of instructions that changes depending on the input."},
{t:'text',v:"Reading the notation\nPiecewise functions are written with a brace and a rule for each interval. Here is an example:\nf(x) = x + 1, if x < 2\nf(x) = 4, if x ≥ 2\nTo evaluate a piecewise function, first decide which interval contains the input, then use only that piece. For example, f(0) = 1 because 0 < 2. Also, f(3) = 4 because 3 ≥ 2."},
{t:'img',v:U_+encodeURIComponent(GRAPH)},
{t:'text',v:"Graphing a piecewise function\nGraph each piece only on its own interval. An open circle means the endpoint is not included, which happens with the symbols < and >. A closed circle means the endpoint is included, which happens with ≤ and ≥. In the graph above, the line stops at an open circle at (2, 3), while the horizontal ray starts at a closed circle at (2, 4)."},
{t:'text',v:"The absolute value function\nThe absolute value function is a piecewise function. It measures the distance of a number from zero, so the output is never negative.\nf(x) = x, if x ≥ 0\nf(x) = -x, if x < 0\nIts graph is a V shape with the vertex at the origin."},
{t:'text',v:"Worked example: evaluating\nEvaluate g(x) = 2x - 1 if x < 0, and g(x) = x² + 3 if x ≥ 0 at x = -2 and x = 4. Since -2 < 0, use the first piece. Then g(-2) = 2(-2) - 1 = -5. Since 4 ≥ 0, use the second piece. Then g(4) = 4² + 3 = 19."},
{t:'text',v:"Continuity and jumps\nA piecewise function is continuous when its pieces connect with no gaps, jumps, or holes. To test continuity at a boundary point x = a, compare the left-hand limit, the right-hand limit, and the value f(a). The function is continuous at a only when all three are equal. In our first example, the left piece approaches 3 as x approaches 2, but f(2) = 4, so there is a jump discontinuity at x = 2."},

{t:'text',v:"What is academic communication?\nAcademic communication is the formal way scholars, teachers, and students share knowledge, ideas, and research. It follows the standards of schools and universities, such as clear structure, accurate evidence, formal language, and proper citation of sources. It appears in essays, research papers, reports, lectures, presentations, and academic discussions."},
{t:'text',v:"The purpose of academic communication\nThe purpose of academic communication is to inform, explain, argue, and persuade using evidence. A student may inform the class about a topic, explain a process, argue a position, or report the results of an investigation. Another purpose is to contribute to a field of study so that other people can build on the idea. Academic communication also trains students to think critically and to organize ideas logically."},
{t:'text',v:"Audience\nThe audience is the person or group who will read or listen to the message. In academic communication the audience is usually teachers, classmates, researchers, or a panel of experts. Knowing the audience helps the writer choose the level of formality, the vocabulary, and how much background to explain. A report for a science teacher uses technical terms, while a talk for younger students needs simpler explanations."},
{t:'text',v:"Context\nContext is the situation in which communication happens, including the setting, the occasion, the culture, and the medium. A formal classroom debate, a thesis defense, and an online discussion board each call for different levels of formality. A good communicator reads the context first, then adjusts the tone, length, and format of the message. Ignoring context can make a correct message sound inappropriate."},
{t:'text',v:"Academic versus non-academic communication\nAcademic and non-academic communication differ in purpose, audience, language, and structure. The table compares the two.\nFeature | Academic communication | Non-academic communication\nPurpose | To inform, explain, and argue with evidence | To chat, entertain, or share personal feelings\nAudience | Teachers, scholars, and experts | Friends, family, and followers\nLanguage | Formal, precise, and objective | Casual, slang, and emotional\nStructure | Organized with an introduction, body, and conclusion | Flexible and often unplanned\nEvidence | Cites reliable and verified sources | May rely on opinion or personal experience\nExample | A research paper on climate change | A text message about weekend plans"},
{t:'text',v:"Comparing with an example\nConsider the same idea written in two ways. The non-academic version says: omg the exam was sooo hard lol, I think the teacher made it impossible. The academic version says: The examination was challenging because it covered topics that were not fully discussed in class, as shown by the low class average. The academic version is formal, objective, and supported by evidence, while the non-academic version is casual and emotional. Both are correct in their own context, but only the academic version fits a school report."},
{t:'text',v:"Putting it together\nTo communicate well in school, ask four questions before you write or speak. What is my purpose? Who is my audience? What is the context? Which language and format fit best? Answering these questions helps you choose the right tone, organize your ideas, and support them with evidence. Practice by rewriting a casual message into an academic one and notice what changes."}]});save()}

 T('Combination (Synthesis) Reaction','A + B → AB','Two or more simpler substances combine to form a single, more complex product.','Burning magnesium ribbon in air to form magnesium oxide (2Mg + O₂ → 2MgO).','Two single individuals (A and B) decide to form a partnership (AB).'),
 T('Decomposition Reaction','AB → A + B','A single complex compound breaks down into two or more simpler substances, usually driven by heat, electricity, or light.','Heating limestone (calcium carbonate) to produce lime and carbon dioxide (CaCO₃ → CaO + CO₂).','A partnership or group (AB) splits apart into individual members (A and B).'),
 T('Single Replacement (Displacement) Reaction','A + BC → AC + B','A more reactive element takes the place of a less reactive element in a compound.','Dropping a piece of zinc into hydrochloric acid, which releases hydrogen gas (Zn + 2HCl → ZnCl₂ + H₂).','A new person (A) cuts into a dancing pair (BC), taking the place of partner B and leaving B alone.'),
 T('Double Replacement (Metathesis) Reaction','AB + CD → AD + CB','The positive ions (cations) and negative ions (anions) of two different ionic compounds switch places, typically forming a precipitate, a gas, or water in an aqueous solution.','Mixing silver nitrate and sodium chloride to form a silver chloride precipitate (AgNO₃ + NaCl → AgCl↓ + NaNO₃).','Two couples (AB and CD) switch partners with each other on the dance floor.'),
 T('Combustion Reaction','Fuel + O₂ → CO₂ + H₂O (typically for hydrocarbons)','A substance reacts rapidly with oxygen gas (O₂), releasing a significant amount of energy in the form of heat and light.','Burning methane gas in a kitchen stove (CH₄ + 2O₂ → CO₂ + 2H₂O).','A campfire consuming wood and releasing warmth and glow to its surroundings.'),
 {t:'text',v:'Evidence of a chemical reaction\nHow do we know a chemical reaction has taken place? Look for these five key pieces of evidence: a change of color, bubbles or gas, a precipitate, a change in temperature, and light emission.'},
 V('Change of color','Observe a noticeable, permanent shift in the color of the substances.','Iron turning into reddish-brown rust when exposed to oxygen and moisture over time.'),
 V('Production of bubbles or gas','Look for fizzing, effervescence, or gas bubbles forming within a liquid mixture.','Dropping an antacid tablet into water, which creates fizzing bubbles of carbon dioxide.'),
 V('Formation of a precipitate','Watch for a cloudy suspension or solid, insoluble particles settling out of two clear liquid solutions.','Mixing clear solutions of lead(II) nitrate and potassium iodide to instantly form a bright yellow solid, lead iodide.'),
 V('Change in temperature','Feel the container getting noticeably warmer (an exothermic reaction releasing heat) or colder (an endothermic reaction absorbing heat).','Instant cold packs dropping in temperature when the inner components mix.'),
 V('Light emission','Observe a sudden glow, flame, or spark produced directly by the chemical process.','A glowing magnesium strip burning with a brilliant white light.'),
 {t:'text',v:'Chemical reactions in daily life\nBaking (baking soda): When baking soda (NaHCO₃) is mixed with an acidic ingredient, such as vinegar or buttermilk, in a cake recipe, a gas-producing reaction occurs. The trapped CO₂ bubbles expand in the oven, causing the cake to rise and become fluffy.\nCleaning: Cleaning products like chlorine bleach work through oxidation-reduction reactions. Bleach breaks apart the chemical bonds of colorful stain molecules, turning them into colorless substances that are easily washed away, while also destroying the cell walls of bacteria.\nBurning and cooking: Cooking food on a gas stove or burning wood in a fireplace relies on combustion. These reactions break down chemical fuels using oxygen to release heat energy that cooks meals or keeps homes warm.'}]});save()}
let adminPw=(()=>{try{return sessionStorage.getItem('sl_ap')||''}catch(e){return ''}})();
async function api(body){try{const r=await fetch('/api/library',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json()}catch(e){return null}}
async function syncLib(){try{const r=await fetch('/api/library?since='+(db.since||0),{cache:'no-store'});if(!r.ok)return;const d=await r.json();let ch=0;(d.gone||[]).forEach(id=>{if(db.items.some(i=>i.id===id)){db.items=db.items.filter(i=>i.id!==id);ch++}});(d.items||[]).forEach(it=>{const k=db.items.findIndex(i=>i.id===it.id);if(k<0)db.items.push(it);else db.items[k]=it;ch++});db.since=Math.max(0,d.now-5000);save();if(ch&&me&&S.view==='lib')render()}catch(e){}}
async function pushItem(it){if(!adminPw)return;const r=await api({action:'save',pw:adminPw,item:it});if(!r||!r.ok)alert('Saved on this device only. The upload to the server failed (no internet, or the item is over about 4 MB). For big videos, use a link instead.');else{it.updated=r.updated;save()}}
async function pubAll(){if(!adminPw)return;let n=0;for(const it of db.items){const r=await api({action:'save',pw:adminPw,item:it});if(r&&r.ok)n++}alert(n+' of '+db.items.length+' items published to everyone.')}
(function(){seedDb();if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});syncLib();setInterval(syncLib,60000);addEventListener('online',syncLib);let n=null;try{n=sessionStorage.getItem('sl_me')}catch(e){}if(n&&db.users[n]){me=n;try{S.view=sessionStorage.getItem('sl_v')||'lib';if(S.view==='adm'&&n!=='admin')S.view='lib'}catch(e){}render()}else authView()})();
</script></body></html>
